<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .frame-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #667eea;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 10px;
            border: 2px solid #667eea;
            text-align: center;
            max-width: 500px;
            z-index: 15;
        }
        
        .error-message h2 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .error-message a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .error-message a:hover {
            text-decoration: underline;
        }
        
        .direct-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
        }
        
        .direct-link:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="frame-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading media server...</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                <h2>⚠️ Connection Issue</h2>
                <p>The media server could not be loaded in the embedded view.</p>
                <p style="margin-top: 1rem;">This might be due to browser security settings or server configuration.</p>
                <a href="http://144.24.152.110:8096" target="_blank" class="direct-link">
                    Open Server Directly
                </a>
            </div>
            
            <iframe 
                id="embyFrame"
                src="http://144.24.152.110:8096"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
            ></iframe>
        </div>
    </div>
    
    <script>
        const iframe = document.getElementById('embyFrame');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        
        // Hide loading spinner after iframe loads
        iframe.addEventListener('load', function() {
            loading.style.display = 'none';
        });
        
        // Show error message if iframe fails to load after timeout
        setTimeout(function() {
            if (loading.style.display !== 'none') {
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
            }
        }, 10000); // 10 second timeout
        
        // Check if iframe loaded successfully
        iframe.addEventListener('error', function() {
            loading.style.display = 'none';
            errorMessage.style.display = 'block';
        });
    </script>
</body>
</html>
